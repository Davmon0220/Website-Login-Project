<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Northline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      (() => {
        const stored = localStorage.getItem("theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute(
          "data-theme",
          stored || (prefersDark ? "dark" : "light")
        );
      })();
    </script>
  </head>
  <body>
    <div class="page">
      <aside class="brand" aria-hidden="true">
        <div class="brand-inner">
          <p class="eyebrow">Northline</p>
          <h1>Welcome back. Pick up where you left off.</h1>
          <p class="lede">
            Secure access to your workspace, projects, and team.
          </p>
        </div>
      </aside>

      <main class="panel">
        <button
          type="button"
          class="theme-toggle"
          id="theme-toggle"
          aria-pressed="false"
          aria-label="Toggle dark mode"
        >
          Dark
        </button>
        <form id="login-form" class="card" novalidate>
          <div class="card-header">
            <p class="logo">Northline</p>
            <h2>Sign in</h2>
            <p class="subtitle">Use your work email to continue.</p>
          </div>

          <div id="form-alert" class="alert" hidden role="alert"></div>

          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              inputmode="email"
              placeholder="you@company.com"
              required
            />
            <p class="error" id="email-error" hidden></p>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="password">Password</label>
              <a class="link" href="#forgot">Forgot password?</a>
            </div>
            <div class="password-wrap">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
                minlength="8"
              />
              <button
                type="button"
                class="ghost"
                id="toggle-password"
                aria-pressed="false"
                aria-controls="password"
              >
                Show
              </button>
            </div>
            <p class="error" id="password-error" hidden></p>
          </div>

          <label class="remember">
            <input type="checkbox" id="remember" name="remember" />
            <span>Keep me signed in</span>
          </label>

          <button type="submit" class="primary" id="submit">Sign in</button>

          <p class="footer-copy">
            New here?
            <a class="link" href="#signup">Create an account</a>
          </p>
        </form>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
